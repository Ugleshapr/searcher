<!DOCTYPE html>
<html lang="ru" data-app-version="V8a" data-color-scheme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Поиск по прайс-листу</title>
  

  <meta http-equiv="Content-Security-Policy"
  content="
    default-src 'self';
    script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.gstatic.com https://apis.google.com;
    style-src  'self' https://cdn.jsdelivr.net 'unsafe-inline';
    img-src    'self' data: https://www.gstatic.com https://lh3.googleusercontent.com;
    font-src   'self' https://r2cdn.perplexity.ai;
    object-src 'none';
    base-uri   'none';
    frame-ancestors 'none';
    frame-src  https://accounts.google.com;
    connect-src
      'self'
      https://www.googleapis.com
      https://identitytoolkit.googleapis.com
      https://securetoken.googleapis.com
      https://firebaseinstallations.googleapis.com
      https://firestore.googleapis.com
      https://firebasestorage.googleapis.com
      https://www.gstatic.com
      https://apis.google.com;
    upgrade-insecure-requests
  ">



  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
 
  <link rel="stylesheet" href="style.css?v=prod-20250818"/>

  <!-- Иконки -->
  <link rel="icon" href="favicon.ico?v=stg-1" sizes="any">
  <link rel="icon" type="image/png" href="icon-32.png?v=stg-1" sizes="32x32">
  <link rel="shortcut icon" href="favicon.ico?v=stg-1">
</head>

<body>


<!-- AUTH: плавающая вкладка справа -->
<div id="authTab" class="auth-tab" aria-live="polite">
    <div class="auth-tab__content">
  <div class="auth-tab__peek" aria-hidden="true" title="Войти"></div>

  
    <div class="auth-tab__header">
      <strong id="authTitle">Гость</strong>
     </div>
    <div id="authStatus" class="auth-status" role="status" aria-live="polite"></div>
    <div id="authLoggedOut" class="auth-view">
      <div class="auth-field">
        <input type="email" id="authEmail" class="form-control" placeholder="Email">
      </div>
      <div class="auth-field">
        <input type="password" id="authPass" class="form-control" placeholder="Пароль">
      </div>
      <button id="btnLogin" class="btn btn--primary btn--full-width">Войти</button>
      <button id="btnLoginGoogle" class="btn btn--outline btn--full-width" style="margin-top:8px;">
  Войти через Google
</button>
      <button id="btnRegister" class="btn btn--secondary btn--full-width" style="margin-top:8px;">Регистрация</button>
    </div>

    <div id="authLoggedIn" class="auth-view" style="display:none;">
      <p class="mb-8" id="authUserEmail"></p>
       <!-- Показывается, если у пользователя ещё нет username -->
<div id="usernameBox" class="auth-view" style="display:none; margin-top:8px;">
  <div class="auth-field">
    <input type="text" id="usernameInput" class="form-control" placeholder="Выбери логин: a-z, 0-9, _ (3–20)">
  </div>
  <button id="btnClaimUsername" class="btn btn--outline btn--full-width">Забронировать логин</button>
</div>
      <button id="btnLogout" class="btn btn--outline btn--full-width">Выйти</button>
     

    </div>

    <small class="auth-hint">Авторизация по желанию. Пока что...</small>
  </div>
</div>

  <!-- Небольшой бейдж, чтобы не перепутать среду -->
  

  <div class="container py-4">

    <!-- Секция поиска -->
    <div class="card mb-3" id="searchSection" style="display:none;">
      <div class="card__body">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3 class="mb-0">Поиск по прайс-листу</h3>
          <span id="datasetInfo" class="text-secondary" style="display:inline-flex;align-items:center;gap:8px;">
  <!-- COPY: компактный тумблер в правом верхнем углу -->
  <span class="copy-inline-title">COPY</span>
  <input type="checkbox" id="copyModeSwitch" />
  <label for="copyModeSwitch" class="copy-switch copy-switch--compact">
    <span class="copy-knob"></span>
  </label>
</span>
        </div>

    
        <!-- Растянутое поле поиска -->
        <div class="search-controls">
          <div class="form-group mb-0">
            <div class="search-input-container">
             <input
  type="text"
  id="searchInput"
  class="form-control"
  placeholder="Введите запрос для поиска..."
  autocomplete="off"
  autocapitalize="off"
  autocorrect="off"
  spellcheck="false"
/>
<button type="button" id="clearSearch"
        class="search-clear-btn"
        aria-label="Очистить"
        title="Очистить">×</button>
            </div>
          </div>
        </div>
      </div>
    </div>

<!-- COPY: панель действий (показывается только в режиме COPY) -->
<div id="copyPanel" class="copy-panel hidden" aria-hidden="true">
  <div class="copy-panel-left">
    <span id="copyCount" class="copy-count">Выбрано: 0</span>
    <div id="copyList" class="copy-list hidden" role="menu" aria-hidden="true"></div>
  </div>
  <div class="copy-panel-right">
  <button id="copySelectAll" class="btn">Выбрать все</button>
  <button id="copyDo" class="btn btn-primary">Копировать N строк</button>
  <button id="copyClear" class="btn btn-ghost" title="Очистить выбор"> 🗑<span class="sr-only">Очистить выбор</span></button>
 </div>
</div>


    <!-- Результаты поиска -->
    <div class="card" id="resultsSection" style="display:none;">
      <div class="card__body">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h3 class="mb-0">Результаты поиска</h3>
          <div class="results-actions d-flex align-items-center gap-2">
            <span id="resultsCount" class="text-secondary">Показаны: 0</span>
                <button type="button" id="filterToggle" class="btn btn--ghost btn--sm" title="Включить фильтр">Фильтр</button>
        </div>
        </div>

        <div id="resultsFlex">
        <div class="table-responsive">
          <table class="table table-striped table-hover" id="resultsTable">
            <thead class="table-dark">
              <tr>
                <th>Наименование</th>
                <th>Артикул</th>
                <th>Цена</th>
                 <th>Документы</th>  
              </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
          </table>
        </div>
        <aside id="filterPanel" style="display:none;"></aside>
        </div>

        <!-- Универсальный баннер состояний: пустой поиск (зелёный) / нет результатов (красный) -->
<div class="state-banner text-center py-4" id="stateBanner" style="display:none;">
  <p class="mb-1" id="stateBannerTitle"></p>
  <small id="stateBannerHint"></small>
</div>

        <div id="resultsShowMore" style="display:flex; justify-content:center; padding:12px;"></div>
      </div>
    </div>

    <!-- Модальное окно ошибок -->
    <div class="modal fade" id="errorModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Ошибка</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="errorMessage"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn--secondary" data-bs-dismiss="modal">Закрыть</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Скрипты -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="app.js"></script>
  <script src="addons/tips.js"></script>
  <script src="addons/copy-mode.js"></script>
  <script src="addons/filter-panel.js"></script>
  <script src="addons/auth.js"></script>

  <!-- Modal: Что нового -->
<div class="modal fade" id="whatsnewModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header">
        <h5 class="modal-title d-flex align-items-center gap-2">
          <span class="badge text-bg-primary" id="whatsnewVersionBadge">v0.0.0</span>
          <span id="whatsnewTitle">Что нового</span>
        </h5>
        <button type="button" class="btn-close" id="whatsnewCloseX" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body" id="whatsnewBody">Загрузка заметок…</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" id="whatsnewOkBtn">Понятно</button>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  const v = document.documentElement.getAttribute('data-app-version');
  if (!v) return;
  document.querySelectorAll('script[src],link[href]').forEach(el=>{
    const attr = el.tagName==='LINK' ? 'href' : 'src';
    const val = el.getAttribute(attr);
    if (!val) return;
    // только локальные файлы, не https://
    if (/^https?:/.test(val)) return;
    if (val.includes('?')) return; // уже есть query
    el.setAttribute(attr, val + '?v=' + encodeURIComponent(v));
  });
})();
</script>

</body>
</html>
