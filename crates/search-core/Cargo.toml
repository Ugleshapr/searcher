[package]
name = "search-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
once_cell = "1.19"
fancy-regex = "0.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
