<!DOCTYPE html>
<html lang="ru" data-color-scheme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Карточка товара</title>

  <!-- CSP: статические ресурсы + два проверенных CDN -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
                 style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
                 img-src 'self' data:;
                 font-src 'self' https://r2cdn.perplexity.ai;
                 object-src 'none';
                 base-uri 'none';
                 frame-ancestors 'none';
                 connect-src 'self';
                 upgrade-insecure-requests">

  <!-- Bootstrap (как на главной) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- Стили карточки -->
  <link rel="stylesheet" href="product.css" />
</head>
<body>
  <div class="container py-4">
    <header class="mb-3 d-flex align-items-start justify-content-between gap-3 flex-wrap">
      <div class="flex-grow-1">
        <h1 id="prodTitle" class="page-title">Загрузка…</h1>
        <div id="prodMeta" class="text-muted small">Артикул: —</div>
      </div>
      <a id="backLink" href="index.html" class="btn btn--secondary">← К поиску</a>
    </header>

    <section id="state" class="mb-3" hidden>
      <div id="stateBox" class="alert" role="alert"></div>
    </section>

    <section id="groupsRoot" class="groups-root">
      <!-- сюда отрисуются группы характеристик -->
    </section>
  </div>

  <!-- Скрипты -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script src="product.js"></script>
</body>
</html>
