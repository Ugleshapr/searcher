name: Pages (prod root)
on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Inject API Key
        env:
          KEAZ_HASH: ${{ secrets.KEAZ_API_HASH }}
        run: |
          FILE_PATH="src/modules/utils/config.js"
          
          # 1. Проверяем, существует ли файл вообще
          if [ ! -f "$FILE_PATH" ]; then
            echo "Ошибка: Файл $FILE_PATH не найден!"
            exit 1
          fi

          # 2. Выполняем замену
          # Используем разделитель | на всякий случай
          sed -i "s|__API_KEY_PLACEHOLDER__|$KEAZ_HASH|g" "$FILE_PATH"

          # 3. ПРОВЕРКА: остался ли плейсхолдер в файле?
          if grep -q "__API_KEY_PLACEHOLDER__" "$FILE_PATH"; then
            echo "КРИТИЧЕСКАЯ ОШИБКА: Плейсхолдер не был заменен!"
            exit 1
          else
            echo "УСПЕХ: Ключ успешно вставлен в config.js"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
