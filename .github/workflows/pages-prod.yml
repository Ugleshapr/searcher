name: Pages (prod root)
on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages        # <-- ОБЯЗАТЕЛЬНО
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Inject API Key
        env:
          # Передаем секрет через переменную окружения (безопасно и надежно)
          KEAZ_HASH: ${{ secrets.KEAZ_API_HASH }}
        run: |
          # Используем | как разделитель, чтобы слеши в хеше не ломали sed
          # Проверяем наличие файла перед заменой
          if [ -f src/modules/utils/config.js ]; then
            sed -i "s|__API_KEY_PLACEHOLDER__|$KEAZ_HASH|g" src/modules/utils/config.js
            echo "Injection successful"
          else
            echo "Error: File src/modules/utils/config.js not found!"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4

