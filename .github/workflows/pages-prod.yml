name: Pages (prod root)
on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Inject API Key
        env:
          KEAZ_HASH: ${{ secrets.KEAZ_API_HASH }}
        run: |
          FILE_PATH="src/modules/utils/config.js"
          
          if [ ! -f "$FILE_PATH" ]; then
            echo "Error: $FILE_PATH not found!"
            exit 1
          fi

          # Выполняем замену
          sed -i "s|__API_KEY_PLACEHOLDER__|$KEAZ_HASH|g" "$FILE_PATH"

          # Проверка результата в логах (скроем сам ключ, но проверим наличие заглушки)
          if grep -q "__API_KEY_PLACEHOLDER__" "$FILE_PATH"; then
            echo "CRITICAL ERROR: Placeholder was NOT replaced!"
            exit 1
          else
            echo "SUCCESS: Key injected into config.js"
            echo "--- Current file content (verification) ---"
            cat "$FILE_PATH"
            echo "--- End of file ---"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          # Отключаем сохранение прав доступа, которые могут влиять на кэш
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
