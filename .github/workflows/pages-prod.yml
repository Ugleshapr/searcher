name: Pages (prod root)
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # берём файлы из main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .                   
      - uses: actions/deploy-pages@v4

