name: Pages (dev under /dev)
on:
  push:
    branches: [ dev ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1) Скачиваем main в site/
      - name: Checkout main into site/
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      # 2) Скачиваем dev в dev-src/
      - name: Checkout dev into dev-src/
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-src

      # 3) Копируем dev в подпапку /dev
      - name: Copy dev into /dev
        run: |
          mkdir -p site/dev
          rsync -a --delete dev-src/ site/dev/

      # 4) Вставляем ключ в оба конфига (и для корня, и для dev)
      - name: Inject API Keys for Prod and Dev
        env:
          KEAZ_HASH: ${{ secrets.KEAZ_API_HASH }}
        run: |
          # Замена в корне (prod версия из main)
          if [ -f site/src/modules/utils/config.js ]; then
            sed -i "s|__API_KEY_PLACEHOLDER__|$KEAZ_HASH|g" site/src/modules/utils/config.js
          fi
          
          # Замена в папке /dev (версия из dev)
          if [ -f site/dev/src/modules/utils/config.js ]; then
            sed -i "s|__API_KEY_PLACEHOLDER__|$KEAZ_HASH|g" site/dev/src/modules/utils/config.js
          fi

      # 5) Деплой
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
