name: Pages (dev under /dev)
on:
  push:
    branches: [ dev ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages        # <-- ОБЯЗАТЕЛЬНО
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1) main в site/
      - name: Checkout main into site/
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      # 2) dev в dev-src/
      - name: Checkout dev into dev-src/
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-src

      # 3) /dev поверх site/
      - name: Copy dev into /dev
        run: |
          mkdir -p site/dev
          rsync -a --delete dev-src/ site/dev/

     - name: Inject API Keys for Prod and Dev
        env:
          KEAZ_HASH: ${{ secrets.KEAZ_API_HASH }}
        run: |
          # 1. Заменяем ключ в корневой (prod) версии
          if [ -f site/src/modules/utils/config.js ]; then
            sed -i "s|__API_KEY_PLACEHOLDER__|$KEAZ_HASH|g" site/src/modules/utils/config.js
          fi
          
          # 2. Заменяем ключ в dev-версии
          if [ -f site/dev/src/modules/utils/config.js ]; then
            sed -i "s|__API_KEY_PLACEHOLDER__|$KEAZ_HASH|g" site/dev/src/modules/utils/config.js
          fi

      # 4) деплой артефакта из папки site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

