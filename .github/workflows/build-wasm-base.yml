name: Build and Pack WASM Base

on:
  workflow_dispatch: {}
  schedule:
    - cron: "35 3 * * *"  # Ежедневно в 06:35 MSK (03:35 UTC) — обновление базы WASM

permissions:
  contents: write
  actions: write

jobs:
  # Проверяем, не отработал ли уже сегодня такой запуск.
  # Это нужно, потому что внутренний cron GitHub может быть сильно задержан,
  # и мы запускаем workflow ещё и из внешнего планировщика через workflow_dispatch.
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check if a successful run already exists today
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TODAY=$(date -u +%Y-%m-%d)
          echo "Today (UTC): $TODAY"

          COUNT_WD=$(gh run list --repo ${{ github.repository }} \
            --workflow "Build and Pack WASM Base" \
            --branch main --event workflow_dispatch --status completed \
            --limit 10 --json createdAt,conclusion \
            --jq '[.[] | select(.createdAt >= "'"$TODAY"'T00:00:00Z" and .conclusion == "success")] | length' || echo 0)

          COUNT_SC=$(gh run list --repo ${{ github.repository }} \
            --workflow "Build and Pack WASM Base" \
            --branch main --event schedule --status completed \
            --limit 10 --json createdAt,conclusion \
            --jq '[.[] | select(.createdAt >= "'"$TODAY"'T00:00:00Z" and .conclusion == "success")] | length' || echo 0)

          TOTAL=$((COUNT_WD + COUNT_SC))
          echo "Successful runs today: $TOTAL"

          if [ "$TOTAL" -gt 0 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "A successful run already exists today. Skipping."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  build-and-pack:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: wasm-base-daily
      cancel-in-progress: false
    steps:
      - name: Checkout rust-wasm branch
        uses: actions/checkout@v4
        with:
          ref: rust-wasm
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt brotli requests

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Pre-build Rust Search Packer
        run: |
          cargo build --release -p search-packer --bin search-packer

      - name: Run Full Base Update Pipeline
        run: |
          python automation/run_pipeline.py

      - name: Commit and push if database changed
        id: commit_step
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add base.bin.br web/base.bin.br web/version.json web/src/addons/products_spec*
          if git diff --cached --quiet; then
            echo "База данных без изменений."
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit -m "auto: update base.bin.br and wasm data [skip ci]"
          git push origin rust-wasm
          echo "changed=true" >> $GITHUB_OUTPUT

      # ПИНАЕМ ДЕПЛОЙ PAGES: Сработает, когда бинарник обновился
      - name: Trigger Pages Deployment
        if: steps.commit_step.outputs.changed == 'true'
        run: gh workflow run "Deploy to GitHub Pages" --ref main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
