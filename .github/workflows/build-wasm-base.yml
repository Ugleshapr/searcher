name: Build and Pack WASM Base

on:
  workflow_dispatch: {}
  schedule:
    - cron: "25 3 * * *"  # Ежедневно в 06:25 MSK (после утреннего обновления КЭАЗ в 05:07)

permissions:
  contents: write

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt brotli requests

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Pre-build Rust Search Packer
        run: |
          cargo build --release -p search-packer

      - name: Run Full Base Update Pipeline
        run: |
          python automation/run_pipeline.py

      - name: Commit and push if database changed
        id: commit_step
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add base.bin.br base.csv web/base.bin.br web/version.json
          if git diff --cached --quiet; then
            echo "База данных без изменений."
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit -m "auto: update base.bin.br and base.csv [skip ci]"
          git push
          echo "changed=true" >> $GITHUB_OUTPUT
