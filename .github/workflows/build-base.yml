name: Build base.csv

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 5 * * *"  # ежедневно в 08:00 MSK

permissions:
  contents: write
  actions: write # ОБЯЗАТЕЛЬНО: даем право запускать другие воркфлоу

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt

      - name: Build base.csv (inside /automation)
        working-directory: automation
        run: |
          python make_base_auto.py
          test -s base.csv

      - name: Move result to repo root
        run: mv -f automation/base.csv ./base.csv

      - name: Commit if changed
        id: commit_step
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add base.csv
          if git diff --cached --quiet; then
            echo "No changes."
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit -m "auto: update base.csv"
          git push
          echo "changed=true" >> $GITHUB_OUTPUT

      # ПИНАЕМ ДЕПЛОЙ PAGES: Сработает только если CSV реально обновился
      - name: Trigger Pages Deployment
        if: steps.commit_step.outputs.changed == 'true'
        run: gh workflow run "Deploy to GitHub Pages" --ref main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
